name: CI

env:
  MOONBIT_VERSION: "0.1.20261020"

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: MoonBit (native + wasm-gc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # The gguf packages (and the fixtures they carry) live in the published
      # `soehi/gguf` module, not in this tree. Its fixture generator moved with
      # them, so there is nothing here to regenerate or diff; the module is
      # verified by its own CI and consumed from the registry.
      #
      # Upstream no longer serves versioned toolchain artifacts, so the
      # installer always fetches "latest". MOONBIT_VERSION is the release this
      # tree was checked against; bump it deliberately when upgrading.
      - name: Assert toolchain
        run: moon version | grep -F "$MOONBIT_VERSION"

      # moon.mod consumes soehi/gguf from the registry; a fresh checkout has no
      # local index, so resolve before checking.
      - name: Resolve registry dependencies
        run: moon update

      - name: Static check (native)
        run: moon check --target native

      - name: Static check (wasm-gc)
        run: moon check --target wasm-gc

      - name: Test (native)
        run: moon test --target native

      - name: Test (wasm-gc)
        run: moon test --target wasm-gc

      - name: Build (native)
        run: moon build --target native

      - name: Build (wasm-gc)
        run: moon build --target wasm-gc

      # The browser target is `js`, not `wasm-gc`: wasm-gc's Bytes is a GC array
      # reference that JavaScript cannot construct, so the model bytes cannot be
      # handed in. The `web` package is the browser surface, and it is the one
      # consumers actually load, so a break here has to fail CI even though the
      # rest of the tree builds for two other backends.
      - name: Build (js, the browser target)
        run: moon build src/web --target js --release

      # Deployment-size gate. These are the two numbers the project's "does it
      # fit on an edge device" claim rests on, so a silent doubling is a
      # regression even when every test passes. No model is needed, which is
      # why this runs here rather than in the model-dependent local gate.
      - name: Deployment size gate
        run: |
          python benchmarks/run.py --no-model --skip-build
          set +e
          python benchmarks/gate.py --sizes-only
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            python -c "import json; m=json.load(open('benchmarks/results.json'))['metrics']; print('::error file=benchmarks/results.json::native_exe_kb=%s web_brotli_kb=%s' % (m['native_exe_kb'], m['web_brotli_kb']))"
          fi
          exit "$status"

  # Windows is a first-class target for this module: the C stubs have
  # 9 _WIN32 branches (Wide-char paths, junction-aware realpath), and the
  # ubuntu job never compiles them. Uses the same MOONBIT_VERSION guard as the
  # ubuntu job.
  windows:
    name: MoonBit (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Assert toolchain
        shell: pwsh
        run: |
          $v = moon version | Out-String
          if (-not $v.Contains($env:MOONBIT_VERSION)) { Write-Error "unexpected: $v"; exit 1 }

      - name: Resolve registry dependencies
        run: moon update

      - name: Static check (native)
        run: moon check --target native

      - name: Test (native)
        run: moon test --target native

      - name: Static check (wasm-gc)
        run: moon check --target wasm-gc

      - name: Test (wasm-gc)
        run: moon test --target wasm-gc

