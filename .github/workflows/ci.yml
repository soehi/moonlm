name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: MoonBit (native + wasm-gc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install Python fixture tooling
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numpy
        run: python -m pip install --disable-pip-version-check numpy

      - name: Verify generated fixtures are up to date
        # The generator is deterministic, so regenerating must leave the
        # checked-in fixtures byte-identical. If this diffs, a generator was
        # edited without re-running it and the committed test data no longer
        # matches its source. `git diff` is used rather than a checksum file so
        # line-ending normalization cannot produce a false failure.
        run: |
          python tools/gen_fixtures.py
          if ! git diff --exit-code -- src/gguf/gen_fixture_test.mbt src/tensor/gen_golden_test.mbt; then
            echo "::error::generated fixtures are stale; run 'python tools/gen_fixtures.py' and commit the result"
            exit 1
          fi

      - name: Show toolchain version
        run: moon version

      - name: Static check (native)
        run: moon check --target native

      - name: Static check (wasm-gc)
        run: moon check --target wasm-gc

      - name: Test (native)
        run: moon test --target native

      - name: Test (wasm-gc)
        run: moon test --target wasm-gc

      - name: Build (native)
        run: moon build --target native

      - name: Build (wasm-gc)
        run: moon build --target wasm-gc

      # The browser target is `js`, not `wasm-gc`: wasm-gc's Bytes is a GC array
      # reference that JavaScript cannot construct, so the model bytes cannot be
      # handed in. The `web` package is the browser surface, and it is the one
      # consumers actually load, so a break here has to fail CI even though the
      # rest of the tree builds for two other backends.
      - name: Build (js, the browser target)
        run: moon build src/web --target js --release
